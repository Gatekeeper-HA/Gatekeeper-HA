configuration:
  camera_name:
    name: Camera name
    description: Must match the camera name in your Frigate config.
  mqtt_host:
    name: MQTT host
    description: Leave empty to use Home Assistant's MQTT broker (the Mosquitto add-on). Set it for an external broker.
  mqtt_port:
    name: MQTT port
  mqtt_username:
    name: MQTT username
    description: Only for an external broker; the Mosquitto add-on's login is used automatically.
  mqtt_password:
    name: MQTT password
  mqtt_topic:
    name: Frigate event topic
    description: Leave as frigate/events unless you changed Frigate's topic prefix.
  audio_rtsp_url:
    name: Audio RTSP URL
    description: go2rtc stream used to record the visitor's answer.
  go2rtc_api:
    name: go2rtc API URL
  go2rtc_talk_stream:
    name: go2rtc talkback stream
    description: go2rtc stream with backchannel=1 that plays audio on the camera speaker.
  frigate_api:
    name: Frigate API URL
    description: Used for the visitor's snapshot in notifications.
  trigger_zones:
    name: Trigger zones
    description: Comma-separated Frigate zones (e.g. porch). Only people who enter one are greeted. Empty means anywhere in view.
  dwell_seconds:
    name: Dwell time (seconds)
    description: How long a person must be visible before Gatekeeper greets them.
  listen_seconds:
    name: Listen time (seconds)
    description: How long to record the visitor's answer.
  session_ttl_seconds:
    name: Session expiry (seconds)
    description: Forget a Frigate event this long after its last update.
  sweep_interval_seconds:
    name: Session check interval (seconds)
  cooldown_seconds:
    name: Cooldown (seconds)
    description: After a visit, new person detections this soon are treated as the same visitor and not greeted again.
  visit_timeout_seconds:
    name: Visit timeout (seconds)
    description: Give up on a visit (greet, listen, reply) after this long.
  audio_retention_days:
    name: Keep visitor recordings (days)
    description: Delete recordings of visitors' answers older than this. 0 keeps them forever.
  event_log_retention_days:
    name: Keep visit logs (days)
    description: Delete daily visit logs (with transcripts) older than this. 0 keeps them forever.
  whisper_model:
    name: Whisper model
    description: Speech-to-text model size. tiny is fastest; small is most accurate.
  whisper_compute_type:
    name: Whisper compute type
    description: int8 for CPU; float32 if you have problems.
  kokoro_voice:
    name: Voice
  greeting:
    name: Greeting
    description: What Gatekeeper says when a visitor arrives.
  reply_delivery:
    name: Reply to a delivery
  reply_sales:
    name: Reply to a solicitor
  reply_maintenance:
    name: Reply to a service visit
  reply_generic:
    name: Reply to any other answer
  reply_no_answer:
    name: Reply to no answer
    description: Said when the visitor stays silent or gives a one-word answer.
  reply_pressed:
    name: Reply to a doorbell press during a visit
    description: Said when the doorbell is pressed during a visit or right after one.
  ntfy_url:
    name: ntfy server URL
    description: Send notifications (with the visitor's snapshot) to this ntfy server. Empty disables them.
  ntfy_topic:
    name: ntfy topic
    description: Default doorbell.
  ntfy_token:
    name: ntfy access token
  reolink_host:
    name: Reolink doorbell host
    description: IP or hostname of a Reolink doorbell, to react to button presses. Empty disables them.
  reolink_username:
    name: Reolink username
  reolink_password:
    name: Reolink password
  log_level:
    name: Log level
  log_format:
    name: Log format
    description: text, or json for one JSON object per line.
