configuration:
  camera_name:
    name: Camera name
    description: Must match the camera name in your Frigate config.
  mqtt_host:
    name: MQTT host
    description: Leave empty to use Home Assistant's MQTT broker (the Mosquitto add-on). Set it for an external broker.
  mqtt_port:
    name: MQTT port
  mqtt_username:
    name: MQTT username
    description: Only for an external broker; the Mosquitto add-on's login is used automatically.
  mqtt_password:
    name: MQTT password
  mqtt_topic:
    name: Frigate event topic
    description: Leave as frigate/events unless you changed Frigate's topic prefix.
  audio_rtsp_url:
    name: Audio RTSP URL
    description: go2rtc stream used to record the visitor's answer.
  go2rtc_api:
    name: go2rtc API URL
  go2rtc_talk_stream:
    name: go2rtc talkback stream
    description: go2rtc stream with backchannel=1 that plays audio on the camera speaker.
  frigate_api:
    name: Frigate API URL
    description: Used for the visitor's snapshot in notifications.
  trigger_zones:
    name: Trigger zones
    description: Comma-separated Frigate zones (e.g. porch). Only people who enter one are greeted. Empty means anywhere in view.
  door_zone:
    name: Door zone
    description: A Frigate zone where someone coming out of your front door first appears (e.g. door). Someone who appears there and walks out of it isn't greeted. Empty greets everyone.
  leaving_watch_seconds:
    name: Leaving time (seconds)
    description: How long someone who appears in the door zone has to walk out of it to count as leaving. Default 3.
  leaving_cooldown_seconds:
    name: Leaving cooldown (seconds)
    description: After someone leaves by the door, person detections this soon count as them too. Default 15.
  return_window_seconds:
    name: Return window (seconds)
    description: Someone who walks up this soon after someone left by the door is taken to be them coming back, and isn't greeted. Default 120; 0 turns it off.
  dwell_seconds:
    name: Dwell time (seconds)
    description: How long a person must be visible before Gatekeeper greets them.
  listen_seconds:
    name: Listen time (seconds)
    description: How long to wait for the visitor to start answering (without the audio tap, how long to record).
  session_ttl_seconds:
    name: Session expiry (seconds)
    description: Forget a Frigate event this long after its last update.
  sweep_interval_seconds:
    name: Session check interval (seconds)
  cooldown_seconds:
    name: Cooldown (seconds)
    description: After a visit, new person detections this soon are treated as the same visitor and not greeted again.
  visit_timeout_seconds:
    name: Visit timeout (seconds)
    description: Give up on a visit (greet, listen, reply; a whole conversation) after this long. A conversation can take up to 2 minutes.
  leave_check_seconds:
    name: Officer leave check (seconds)
    description: After asking an officer without a judge-signed warrant to leave, wait this long; if Frigate still sees someone, ask again more firmly. Default 20.
  audio_tap:
    name: Audio tap
    description: Read the camera's audio all the time and stop listening when the visitor stops talking. Off records a fixed window per prompt. Default on.
  vad_threshold:
    name: Speech threshold
    description: Speech probability (0.1-0.9) above which audio counts as the visitor talking. Default 0.5.
  end_silence_ms:
    name: End-of-answer silence (ms)
    description: Silence after the visitor's last word that ends their answer. Default 800.
  max_answer_seconds:
    name: Longest answer (seconds)
    description: Cut off an answer longer than this. Default 15.
  talkback_session:
    name: Talkback connection
    description: visit (default) keeps one connection for the whole visit; clip opens one per phrase, for cameras that misbehave with a long connection.
  audio_retention_days:
    name: Keep visitor recordings (days)
    description: Delete recordings of visitors' answers older than this. 0 keeps them forever.
  event_log_retention_days:
    name: Keep visit logs (days)
    description: Delete daily visit logs (with transcripts) older than this. 0 keeps them forever.
  whisper_model:
    name: Whisper model
    description: Speech-to-text model size. tiny is fastest; small is most accurate.
  whisper_compute_type:
    name: Whisper compute type
    description: int8 for CPU; float32 if you have problems.
  whisper_hotwords:
    name: Whisper hotwords
    description: Comma-separated words and names Whisper should expect, e.g. local candidates' names.
  kokoro_voice:
    name: Voice
  greeting:
    name: Greeting
    description: What Gatekeeper says when a visitor arrives.
  reply_delivery:
    name: Reply to a delivery
  reply_sales:
    name: Reply to a solicitor
  reply_maintenance:
    name: Reply to a service visit
  reply_generic:
    name: Reply to any other answer
  reply_no_answer:
    name: Reply to no answer
    description: Said when the visitor stays silent or gives a one-word answer.
  reply_pressed:
    name: Reply to a doorbell press during a visit
    description: Said when the doorbell is pressed during a visit or right after one.
  phrase_emergency_wait:
    name: "Emergency: wait"
    description: "Empty: I have alerted the resident. Please wait."
  phrase_police_ask_reason:
    name: "Officer: reason and warrant"
    description: "Empty: This is an automated assistant, and this conversation is recorded. What is the reason for your visit, and do you have a warrant?"
  phrase_police_disclosure:
    name: "Officer: disclosure"
    description: "Empty: This is an automated assistant, and this conversation is recorded."
  phrase_police_ask_warrant:
    name: "Officer: warrant?"
    description: "Empty: Do you have a warrant? Please answer yes or no."
  phrase_police_ask_identity:
    name: "Officer: identity"
    description: "Empty: Please state your agency, your name, and your badge number."
  phrase_police_show_warrant:
    name: "Officer: show the warrant"
    description: "Empty: Please hold the warrant close to the camera and keep it still. Is it signed by a judge?"
  phrase_police_hold_warrant:
    name: "Officer: keep holding it"
    description: "Empty: Please keep holding it there while I look it over. I'll let you know when I'm finished."
  phrase_police_warrant_done:
    name: "Officer: photos taken"
    description: "Empty: I'm finished. You can lower it now."
  phrase_police_notifying:
    name: "Officer: notifying the resident"
    description: "Empty: Thank you. I am notifying the resident now. Please wait."
  phrase_police_leave:
    name: "Officer: please leave"
    description: "Empty: The resident does not consent to entry or a search without a warrant signed by a judge. Please leave the property."
  phrase_police_leave_again:
    name: "Officer: second request to leave"
    description: "Empty: You have been asked to leave. The resident does not consent to your presence, this conversation is recorded, and legal action will be taken if you remain."
  phrase_civic_ask_identity:
    name: "Canvasser: who are you"
    description: "Empty: Thanks for stopping by. Could you tell me your name, and who you're with?"
  phrase_civic_ask_message:
    name: "Canvasser: message"
    description: "Empty: What message would you like me to pass on to the resident?"
  phrase_civic_thanks:
    name: "Canvasser: thanks"
    description: "Empty: Thank you. I'll make sure the resident gets your message. Feel free to leave any literature at the door."
  ntfy_url:
    name: ntfy server URL
    description: Send notifications (with the visitor's snapshot) to this ntfy server. Empty disables them.
  ntfy_topic:
    name: ntfy topic
    description: Default doorbell.
  ntfy_token:
    name: ntfy access token
  reolink_host:
    name: Reolink doorbell host
    description: IP or hostname of a Reolink doorbell, to react to button presses. Empty disables them.
  reolink_username:
    name: Reolink username
  reolink_password:
    name: Reolink password
  log_level:
    name: Log level
  log_format:
    name: Log format
    description: text, or json for one JSON object per line.
