configuration:
  camera_name:
    name: Camera name
    description: Must match the camera name in your Frigate config.
  mqtt_host:
    name: MQTT host
    description: MQTT broker host. core-mosquitto is Home Assistant's Mosquitto add-on.
  mqtt_port:
    name: MQTT port
  mqtt_topic:
    name: Frigate event topic
    description: Leave as frigate/events unless you changed Frigate's topic prefix.
  audio_rtsp_url:
    name: Audio RTSP URL
    description: go2rtc stream used to record the visitor's answer.
  go2rtc_api:
    name: go2rtc API URL
  go2rtc_talk_stream:
    name: go2rtc talkback stream
    description: go2rtc stream with backchannel=1 that plays audio on the camera speaker.
  dwell_seconds:
    name: Dwell time (seconds)
    description: How long a person must be visible before Gatekeeper greets them.
  listen_seconds:
    name: Listen time (seconds)
    description: How long to record the visitor's answer.
  session_ttl_seconds:
    name: Session expiry (seconds)
    description: Forget a Frigate event this long after its last update.
  sweep_interval_seconds:
    name: Session check interval (seconds)
  whisper_model:
    name: Whisper model
    description: Speech-to-text model size. tiny is fastest; small is most accurate.
  whisper_compute_type:
    name: Whisper compute type
    description: int8 for CPU; float32 if you have problems.
  kokoro_voice:
    name: Voice
  greeting:
    name: Greeting
    description: What Gatekeeper says when a visitor arrives.
  reply_delivery:
    name: Reply to a delivery
  reply_sales:
    name: Reply to a solicitor
  reply_maintenance:
    name: Reply to a service visit
  reply_generic:
    name: Reply to any other answer
  reply_no_answer:
    name: Reply to no answer
    description: Said when the visitor stays silent or gives a one-word answer.
  log_level:
    name: Log level
  log_format:
    name: Log format
    description: text, or json for one JSON object per line.
