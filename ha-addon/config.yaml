name: "Gatekeeper AI Doorbell"
description: "AI-powered doorbell assistant. Greets visitors via speaker, listens for their response, classifies their intent, and replies — all processed locally."
version: "0.1.0"
slug: "gatekeeper"
url: "https://github.com/Gatekeeper-HA/Gatekeeper-HA"
arch:
  - aarch64
  - amd64
init: false
# Uses Home Assistant's MQTT service (e.g. the Mosquitto add-on) when there is
# one; the mqtt_* options override it, e.g. for an external broker.
services:
  - "mqtt:want"
options:
  camera_name: "front_door"
  mqtt_topic: "frigate/events"
  # Defaults for the Frigate add-on; see the documentation for other installs.
  audio_rtsp_url: "rtsp://ccab4aaf-frigate:8554/front_door"
  go2rtc_api: "http://ccab4aaf-frigate:1984"
  go2rtc_talk_stream: "front_door_talk"
  frigate_api: "http://ccab4aaf-frigate:5000"
  dwell_seconds: 1
  listen_seconds: 4
  session_ttl_seconds: 120
  sweep_interval_seconds: 1
  cooldown_seconds: 90
  visit_timeout_seconds: 60
  whisper_model: "tiny"
  whisper_compute_type: "int8"
  kokoro_voice: "af_heart"
  greeting: "Hello. This property is monitored. Please state the purpose of your visit."
  reply_delivery: "Thank you. Please leave the package at the door."
  reply_sales: "No solicitation. Please leave the property."
  reply_maintenance: "Please wait while I notify the resident."
  reply_generic: "Thank you. Please wait while I notify the resident."
  reply_no_answer: "You are being recorded. Please state your purpose or leave the property."
  reply_pressed: "The resident has already been notified."
  audio_retention_days: 7
  event_log_retention_days: 30
  log_level: "info"
  log_format: "text"
schema:
  camera_name: str
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  mqtt_topic: str
  audio_rtsp_url: str
  go2rtc_api: url
  go2rtc_talk_stream: str
  frigate_api: url
  trigger_zones: str?
  dwell_seconds: float(0,)
  listen_seconds: int(1,30)
  session_ttl_seconds: int(10,)
  sweep_interval_seconds: float(0.1,)
  cooldown_seconds: int(0,)
  visit_timeout_seconds: int(15,)
  whisper_model: "list(tiny|base|small|tiny.en|base.en|small.en)"
  whisper_compute_type: "list(int8|float32)"
  kokoro_voice: "list(af_heart|af_bella|af_sarah|am_michael|am_adam|bm_george|bf_emma)"
  greeting: str
  reply_delivery: str
  reply_sales: str
  reply_maintenance: str
  reply_generic: str
  reply_no_answer: str
  reply_pressed: str
  ntfy_url: url?
  ntfy_topic: str?
  ntfy_token: password?
  reolink_host: str?
  reolink_username: str?
  reolink_password: password?
  audio_retention_days: int(0,)
  event_log_retention_days: int(0,)
  log_level: "list(debug|info|warning|error)"
  log_format: "list(text|json)"
